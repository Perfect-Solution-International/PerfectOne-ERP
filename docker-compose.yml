      - ./database/migrations/039_purchase_order_batches.sql:/docker-entrypoint-initdb.d/039_purchase_order_batches.sql:ro
      - ./database/migrations/040_cashier_session_control.sql:/docker-entrypoint-initdb.d/040_cashier_session_control.sql:ro
      - ./database/migrations/041_finance_accounting_workflows.sql:/docker-entrypoint-initdb.d/041_finance_accounting_workflows.sql:ro
      - ./database/migrations/042_procurement_receiving_integrity.sql:/docker-entrypoint-initdb.d/042_procurement_receiving_integrity.sql:ro
      - ./database/migrations/043_procurement_completion.sql:/docker-entrypoint-initdb.d/043_procurement_completion.sql:ro
      - ./database/migrations/044_pos_sales_completion.sql:/docker-entrypoint-initdb.d/044_pos_sales_completion.sql:ro
      - ./database/migrations/045_cashier_sales_controls.sql:/docker-entrypoint-initdb.d/045_cashier_sales_controls.sql:ro
      - ./database/migrations/046_accounting_completion.sql:/docker-entrypoint-initdb.d/046_accounting_completion.sql:ro
      - ./database/migrations/047_inventory_approvals.sql:/docker-entrypoint-initdb.d/047_inventory_approvals.sql:ro
      - ./database/migrations/048_batch_transfers.sql:/docker-entrypoint-initdb.d/048_batch_transfers.sql:ro
      - ./database/migrations/049_pos_discount_approvals.sql:/docker-entrypoint-initdb.d/049_pos_discount_approvals.sql:ro
      - ./database/migrations/050_payment_cheques.sql:/docker-entrypoint-initdb.d/050_payment_cheques.sql:ro
      - ./database/migrations/051_branch_management.sql:/docker-entrypoint-initdb.d/051_branch_management.sql:ro
      - ./database/migrations/052_transfer_documents.sql:/docker-entrypoint-initdb.d/052_transfer_documents.sql:ro
      - ./database/migrations/053_system_settings.sql:/docker-entrypoint-initdb.d/053_system_settings.sql:ro
      - ./database/migrations/054_data_imports.sql:/docker-entrypoint-initdb.d/054_data_imports.sql:ro
      - ./database/migrations/055_backup_history.sql:/docker-entrypoint-initdb.d/055_backup_history.sql:ro
      - ./database/migrations/056_partial_stock_transfers.sql:/docker-entrypoint-initdb.d/056_partial_stock_transfers.sql:ro
      - ./database/migrations/057_scheduled_backups.sql:/docker-entrypoint-initdb.d/057_scheduled_backups.sql:ro
      - ./database/migrations/058_accounting_ledger_integrity.sql:/docker-entrypoint-initdb.d/058_accounting_ledger_integrity.sql:ro
      - ./database/migrations/059_transfer_damage_accounting.sql:/docker-entrypoint-initdb.d/059_transfer_damage_accounting.sql:ro
      - ./database/migrations/060_promotions.sql:/docker-entrypoint-initdb.d/060_promotions.sql:ro
      - ./database/migrations/061_settings_integration.sql:/docker-entrypoint-initdb.d/061_settings_integration.sql:ro
      - ./database/migrations/062_notifications_archive_centre.sql:/docker-entrypoint-initdb.d/062_notifications_archive_centre.sql:ro
      - ./database/migrations/063_offline_sync_hardening.sql:/docker-entrypoint-initdb.d/063_offline_sync_hardening.sql:ro
      - ./database/migrations/064_accounting_core_structure.sql:/docker-entrypoint-initdb.d/064_accounting_core_structure.sql:ro
      - ./database/migrations/065_cash_account_control_types.sql:/docker-entrypoint-initdb.d/065_cash_account_control_types.sql:ro
      - ./database/migrations/066_sale_posting_single_source.sql:/docker-entrypoint-initdb.d/066_sale_posting_single_source.sql:ro
      - ./database/migrations/067_control_account_reconciliation.sql:/docker-entrypoint-initdb.d/067_control_account_reconciliation.sql:ro
      - ./database/migrations/068_balance_date_filter_fix.sql:/docker-entrypoint-initdb.d/068_balance_date_filter_fix.sql:ro
      - ./database/migrations/069_measurement_and_unit_conversions.sql:/docker-entrypoint-initdb.d/069_measurement_and_unit_conversions.sql:ro
  migrations:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grocerly
      POSTGRES_USER: grocerly
      POSTGRES_PASSWORD: grocerly
    volumes:
      - ./database/migrations:/migrations:ro
      - ./database/run-migrations.sh:/run-migrations.sh:ro
    entrypoint: ["/bin/sh", "/run-migrations.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgres://grocerly:grocerly@postgres:5432/grocerly?sslmode=disable
      WEB_ORIGIN: http://localhost:3001
      JWT_SECRET: grocerly-dev-secret-change-me
    ports: ["8080:8080"]
    volumes:
      - ./backups:/backups
    depends_on:
      migrations:
        condition: service_completed_successfully
  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8080
    environment:
      API_INTERNAL_URL: http://api:8080
    ports: ["3001:3000"]
    depends_on:
      api:
        condition: service_started
volumes:
  postgres_data:
