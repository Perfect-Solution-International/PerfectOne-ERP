# Pinned so the compose project (and therefore the postgres data volume) no longer
# depends on what this directory happens to be called. Renaming the folder without
# this would make compose look for a volume that does not exist and silently start
# with an empty database.
name: perfectone-erp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grocerly
      POSTGRES_USER: grocerly
      POSTGRES_PASSWORD: grocerly
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocerly -d grocerly"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./database/migrations/002_demo_data.sql:/docker-entrypoint-initdb.d/002_demo_data.sql:ro
      - ./database/migrations/003_usernames.sql:/docker-entrypoint-initdb.d/003_usernames.sql:ro
      - ./database/migrations/004_operations.sql:/docker-entrypoint-initdb.d/004_operations.sql:ro
      - ./database/migrations/005_demo_records.sql:/docker-entrypoint-initdb.d/005_demo_records.sql:ro
      - ./database/migrations/006_customer_email.sql:/docker-entrypoint-initdb.d/006_customer_email.sql:ro
      - ./database/migrations/007_tenants_and_branches.sql:/docker-entrypoint-initdb.d/007_tenants_and_branches.sql:ro
      - ./database/migrations/008_accounting_audit.sql:/docker-entrypoint-initdb.d/008_accounting_audit.sql:ro
      - ./database/migrations/009_accounting_triggers.sql:/docker-entrypoint-initdb.d/009_accounting_triggers.sql:ro
      - ./database/migrations/010_pos_lifecycle.sql:/docker-entrypoint-initdb.d/010_pos_lifecycle.sql:ro
      - ./database/migrations/011_ledgers_payments.sql:/docker-entrypoint-initdb.d/011_ledgers_payments.sql:ro
      - ./database/migrations/012_ledger_opening_balances.sql:/docker-entrypoint-initdb.d/012_ledger_opening_balances.sql:ro
      - ./database/migrations/013_stock_sessions_cash_accounting.sql:/docker-entrypoint-initdb.d/013_stock_sessions_cash_accounting.sql:ro
      - ./database/migrations/014_cash_account_seed.sql:/docker-entrypoint-initdb.d/014_cash_account_seed.sql:ro
      - ./database/migrations/015_pos_accounting_completion.sql:/docker-entrypoint-initdb.d/015_pos_accounting_completion.sql:ro
      - ./database/migrations/016_security_hardening.sql:/docker-entrypoint-initdb.d/016_security_hardening.sql:ro
      - ./database/migrations/017_management_crud.sql:/docker-entrypoint-initdb.d/017_management_crud.sql:ro
      - ./database/migrations/018_user_permissions.sql:/docker-entrypoint-initdb.d/018_user_permissions.sql:ro
      - ./database/migrations/019_user_lifecycle_and_history.sql:/docker-entrypoint-initdb.d/019_user_lifecycle_and_history.sql:ro
      - ./database/migrations/020_roles_and_granular_permissions.sql:/docker-entrypoint-initdb.d/020_roles_and_granular_permissions.sql:ro
      - ./database/migrations/021_product_management.sql:/docker-entrypoint-initdb.d/021_product_management.sql:ro
      - ./database/migrations/022_catalog_taxonomy_and_barcodes.sql:/docker-entrypoint-initdb.d/022_catalog_taxonomy_and_barcodes.sql:ro
      - ./database/migrations/023_contact_management.sql:/docker-entrypoint-initdb.d/023_contact_management.sql:ro
      - ./database/migrations/024_procurement_inventory_workflows.sql:/docker-entrypoint-initdb.d/024_procurement_inventory_workflows.sql:ro
      - ./database/migrations/025_supplier_product_catalogue.sql:/docker-entrypoint-initdb.d/025_supplier_product_catalogue.sql:ro
      - ./database/migrations/026_transaction_safety.sql:/docker-entrypoint-initdb.d/026_transaction_safety.sql:ro
      - ./database/migrations/027_payment_safety.sql:/docker-entrypoint-initdb.d/027_payment_safety.sql:ro
      - ./database/migrations/028_accounting_foundation.sql:/docker-entrypoint-initdb.d/028_accounting_foundation.sql:ro
      - ./database/migrations/029_inventory_ledger.sql:/docker-entrypoint-initdb.d/029_inventory_ledger.sql:ro
      - ./database/migrations/030_sales_lifecycle.sql:/docker-entrypoint-initdb.d/030_sales_lifecycle.sql:ro
      - ./database/migrations/031_procurement_safety.sql:/docker-entrypoint-initdb.d/031_procurement_safety.sql:ro
      - ./database/migrations/032_purchase_order_safety.sql:/docker-entrypoint-initdb.d/032_purchase_order_safety.sql:ro
      - ./database/migrations/033_stock_transfer_safety.sql:/docker-entrypoint-initdb.d/033_stock_transfer_safety.sql:ro
